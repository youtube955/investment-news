title: "投資市況ニュース - プロフェッショナル市場分析"
description: "AIによる本格的な市場分析と投資戦略。日経平均、米国株、為替の詳細解説"
lang: ja
timezone: Asia/Tokyo

baseurl: ""
url: "https://youtube955.github.io"

# Theme settings
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

# Collections
collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Market Analyst AI"

# Custom settings
show_excerpts: true
excerpt_length: 150
