title: "投資市況ニュース"
description: "毎日の市場分析と投資戦略"
lang: ja
timezone: Asia/Tokyo

baseurl: "/investment-news"
url: "https://youtube955.github.io"

# note風のシンプルなテーマ
theme: minima

sass:
  style: compressed

plugins:
  - jekyll-feed
  - jekyll-seo-tag

collections:
  posts:
    output: true
    permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Market Analyst AI"

show_excerpts: true
excerpt_length: 200
